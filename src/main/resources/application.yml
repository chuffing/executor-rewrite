server:
  port: ${SERVER_PORT:9101}

spring:
  application:
    name: redis-monitor-agent

agent:

  # 执行器基础信息
  agent-name: ${AGENT_NAME:}

  # 平台通信
  platform:
    url: ${AGENT_PLATFORM_URL:http://localhost:8100}
    register-code: ${AGENT_REGISTER_CODE:}
    token-file: ${AGENT_TOKEN_FILE:./agent-token.dat}

  # 定时任务
  schedule:
    collect-interval: ${AGENT_COLLECT_INTERVAL:300000}
    heartbeat-interval: ${AGENT_HEARTBEAT_INTERVAL:30000}

  # Redis
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}
    timeout: ${REDIS_TIMEOUT:2000}

    service-name: ${REDIS_SERVICE_NAME:}
    config-file: ${REDIS_CONFIG_FILE:}
    data-dir: ${REDIS_DATA_DIR:}
    backup-file: ${REDIS_BACKUP_FILE:}

    pool:
      max-total: 5
      max-idle: 2
      min-idle: 1
      max-wait-millis: 2000

  # Sentinel
  sentinel:
    port: ${SENTINEL_PORT:26379}
    service-name: ${SENTINEL_SERVICE_NAME:}
    config-file: ${SENTINEL_CONFIG_FILE:}
    backup-file: ${SENTINEL_BACKUP_FILE:}

  # 运维操作
  operation:
    script-dir: ${AGENT_SCRIPT_DIR:}
    upgrade-dir: ${AGENT_UPGRADE_DIR:/tmp/redis-upgrade/}

    script-timeout-seconds: 10
    stop-check-timeout-seconds: 10
    stop-check-interval-millis: 1000

logging:
  level:
    com.icbc.nbfh: INFO